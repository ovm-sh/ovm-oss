[package]
name = "ovm-codex-skew"
version = "0.1.7"
edition = "2021"
license = "MIT"
description = "Codex state-DB schema-skew guard — an OVM companion plugin"
repository = "https://github.com/ovm-sh/ovm-oss"

# Binary name = package name = `ovm-codex-skew`, i.e. the OVM subcommand
# `ovm codex-skew` and the companion OVM runs for Codex at lifecycle events.
[[bin]]
name = "ovm-codex-skew"
path = "src/main.rs"

[lib]
name = "ovm_codex_skew"
path = "src/lib.rs"

[dependencies]
console = "0.15"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
# The served evidence document (`codex-skew.json`) is JSON; the guard reads it
# from OVM's registry cache and never fetches it itself.
# O_NONBLOCK for the evidence read: a FIFO at the cache path must not hang a launch.
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
